name: Build and publish Aidoku sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sources/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "sources/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: aidoku-build-${{ github.ref }}
  cancel-in-progress: true

env:
  AIDOKU_CLI_REV: 1a6bb691dd67c7151fc76fc852fb5a364d325f72
  SOURCE_LIST_NAME: Ulrichstern Aidoku Sources

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and the WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install the Aidoku CLI
        run: cargo install --git https://github.com/Aidoku/aidoku-rs --rev "$AIDOKU_CLI_REV" --target x86_64-unknown-linux-gnu aidoku-cli

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check the WASM workspace
        run: cargo check --workspace

      - name: Build all source packages
        shell: bash
        run: |
          set -euo pipefail
          for source_dir in sources/*; do
            if [[ -f "$source_dir/Cargo.toml" ]]; then
              echo "Packaging $source_dir"
              source_dir="$(realpath "$source_dir")"
              (
                cd "$source_dir"
                # aidoku-cli copies the first WASM it finds, so each source
                # needs its own target directory in a Cargo workspace.
                CARGO_TARGET_DIR="$PWD/target" aidoku package
              )

              crate_name="$(sed -n 's/^name = "\([^"]*\)"/\1/p' "$source_dir/Cargo.toml" | head -n 1 | tr '-' '_')"
              wasm_path="$source_dir/target/wasm32-unknown-unknown/release/$crate_name.wasm"
              if [[ ! -f "$wasm_path" ]]; then
                echo "Missing WASM for $crate_name" >&2
                exit 1
              fi
              built_hash="$(sha256sum "$wasm_path" | cut -d ' ' -f 1)"
              packaged_hash="$(unzip -p "$source_dir/package.aix" Payload/main.wasm | sha256sum | cut -d ' ' -f 1)"
              if [[ "$built_hash" != "$packaged_hash" ]]; then
                echo "Wrong WASM embedded in $source_dir/package.aix" >&2
                exit 1
              fi
            fi
          done

      - name: Verify all source packages
        run: aidoku verify sources/*/package.aix

      - name: Generate the Aidoku source list
        run: aidoku build sources/*/package.aix --name "$SOURCE_LIST_NAME" --output public

      - name: Show the installation URL
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          source_list_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/index.min.json"
          {
            echo "## Aidoku source list"
            echo
            echo "Add this URL in Aidoku after GitHub Pages is enabled:"
            echo
            echo "\`$source_list_url\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidoku-sources-${{ github.sha }}
          path: public
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Attach packages to a tagged GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            public/index.json
            public/index.min.json
            public/sources/*.aix

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
